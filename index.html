    // --- SOUND ENGINE (Web Audio API Synthesizer) ---
    class SoundEngine {
      static audioCtx = null;

      static init() {
        if (!this.audioCtx && typeof window !== 'undefined') {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          if (AudioContext) {
            this.audioCtx = new AudioContext();
          }
        }
      }

      static playBeadClick() {
        try {
          this.init();
          if (!this.audioCtx) return;
          if (this.audioCtx.state === 'suspended') this.audioCtx.resume();
          
          const osc = this.audioCtx.createOscillator();
          const gain = this.audioCtx.createGain();
          
          osc.type = 'sine';
          osc.frequency.setValueAtTime(440, this.audioCtx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, this.audioCtx.currentTime + 0.04);
          
          gain.gain.setValueAtTime(0.2, this.audioCtx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.audioCtx.currentTime + 0.05);
          
          osc.connect(gain);
          gain.connect(this.audioCtx.destination);
          
          osc.start();
          osc.stop(this.audioCtx.currentTime + 0.06);

          if (navigator.vibrate) navigator.vibrate(15);
        } catch (e) {
          console.log('Audio error:', e);
        }
      }

      static playNotificationChime() {
        try {
          this.init();
          if (!this.audioCtx) return;
          if (this.audioCtx.state === 'suspended') this.audioCtx.resume();

          const now = this.audioCtx.currentTime;
          const notes = [523.25, 659.25, 783.99, 1046.50];

          notes.forEach((freq, idx) => {
            const osc = this.audioCtx.createOscillator();
            const gain = this.audioCtx.createGain();
            const start = now + idx * 0.12;

            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, start);

            gain.gain.setValueAtTime(0.001, start);
            gain.gain.linearRampToValueAtTime(0.2, start + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.0001, start + 1.2);

            osc.connect(gain);
            gain.connect(this.audioCtx.destination);

            osc.start(start);
            osc.stop(start + 1.3);
          });
        } catch (e) {}
      }
    }

      { id: 112, name: "الإخلاص", page: 604, ayahs: 4, type: "مكية" },
      { id: 113, name: "الفلق", page: 604, ayahs: 5, type: "مكية" },
      { id: 114, name: "الناس", page: 604, ayahs: 6, type: "مدنية" }
    ];

    const JUZ_PAGES = [
      1, 22, 42, 62, 82, 102, 121, 142, 162, 182,
      201, 222, 242, 262, 282, 302, 322, 342, 362, 382,
      402, 422, 442, 462, 482, 502, 522, 542, 562, 582
    ];

    const toArabicDigits = (num) => {
      if (num === null || num === undefined) return '';
      return num.toString().replace(/\d/g, d => '٠١٢٣٤٥٦٧٨٩'[d]);
    };

    // --- مكوّن قارئ المصحف الشريف المتقدم (QuranReader) ---
    function QuranReader({
      currentPage,
      onPageChange,
      isModal,
      onClose,
      onReflectAyah,
      quranBookmark,
      onSaveBookmark,
      onIncrementDailyPages,
      dailyPagesCount
    }) {
      const [pageData, setPageData] = useState([]);
      const [loading, setLoading] = useState(false);
      const [error, setError] = useState(null);
      const [fontSize, setFontSize] = useState(24);
      const [selectedAyah, setSelectedAyah] = useState(null);
      const [tafseerText, setTafseerText] = useState(null);
      const [loadingTafseer, setLoadingTafseer] = useState(false);
      const [playingAyahNumber, setPlayingAyahNumber] = useState(null);
      const [toastMsg, setToastMsg] = useState(null);

      const audioRef = useRef(null);

      // الذاكرة المؤقتة للصفحات لتفادي تكرار التحميل
      const cacheRef = useRef({});

      const showToast = (msg) => {
        setToastMsg(msg);
        setTimeout(() => setToastMsg(null), 3000);
      };

      const fetchPage = async (page) => {
        if (cacheRef.current[page]) {
          setPageData(cacheRef.current[page]);
          setLoading(false);
          setError(null);
          return;
        }

        setLoading(true);
        setError(null);
        try {
          const res = await fetch(`https://api.alquran.cloud/v1/page/${page}/quran-uthmani`);
          const data = await res.json();
          if (data && data.status === 'OK' && data.data && data.data.ayahs) {
            cacheRef.current[page] = data.data.ayahs;
            setPageData(data.data.ayahs);
            
            // تحميل استباقي للصفحة التالية والسابقة في الخلفية
            if (page < 604 && !cacheRef.current[page + 1]) {
              fetch(`https://api.alquran.cloud/v1/page/${page + 1}/quran-uthmani`)
                .then(r => r.json())
                .then(d => { if (d && d.data) cacheRef.current[page + 1] = d.data.ayahs; })
                .catch(() => {});
            }
            if (page > 1 && !cacheRef.current[page - 1]) {
              fetch(`https://api.alquran.cloud/v1/page/${page - 1}/quran-uthmani`)
                .then(r => r.json())
                .then(d => { if (d && d.data) cacheRef.current[page - 1] = d.data.ayahs; })
                .catch(() => {});
            }
          } else {
            throw new Error('تعذر تحميل بيانات الصفحة');
          }
        } catch (err) {
          setError('تعذر تحميل صفحة المصحف. يرجى التحقق من اتصال الإنترنت والنقر لإعادة المحاولة.');
        } finally {
          setLoading(false);
        }
      };

      useEffect(() => {
        fetchPage(currentPage);
        if (audioRef.current) {
          audioRef.current.pause();
          setPlayingAyahNumber(null);
        }
      }, [currentPage]);

      // دعم أزرار الأسهم في لوحة المفاتيح
      useEffect(() => {
        const handleKeyDown = (e) => {
          if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
          if (e.key === 'ArrowLeft') {
            // في اللغة العربية، السهم الأيسر ينقل للصفحة التالية
            if (currentPage < 604) onPageChange(currentPage + 1);
          } else if (e.key === 'ArrowRight') {
            // السهم الأيمن ينقل للصفحة السابقة
            if (currentPage > 1) onPageChange(currentPage - 1);
          } else if (e.key === 'Escape' && isModal && onClose) {
            onClose();
          }
        };

        window.addEventListener('keydown', handleKeyDown);
        return () => window.removeEventListener('keydown', handleKeyDown);
      }, [currentPage, isModal, onClose, onPageChange]);

      // استخراج تفاصيل السورة والجزء والصفحة الحالية
      const currentMeta = useMemo(() => {
        if (!pageData || pageData.length === 0) {
          // استنتاج تقريبي من جدول السور
          const found = SURAHS_LIST.slice().reverse().find(s => s.page <= currentPage) || SURAHS_LIST[0];
          return {
            surahName: found.name,
            juzNumber: JUZ_PAGES.filter(p => p <= currentPage).length || 1,
            revelationType: found.type
          };
        }
        const firstAyah = pageData[0];
        return {
          surahName: firstAyah.surah.name.replace('سُورَةُ ', ''),
          juzNumber: firstAyah.juz,
          hizb: Math.ceil(firstAyah.hizbQuarter / 4),
          hizbQuarter: firstAyah.hizbQuarter
        };
      }, [pageData, currentPage]);

      // تشغيل / إيقاف الصوت للآية
      const playAyahAudio = (ayah) => {
        if (playingAyahNumber === ayah.number) {
          if (audioRef.current) audioRef.current.pause();
          setPlayingAyahNumber(null);
          return;
        }

        const audioUrl = `https://cdn.islamic.network/quran/audio/128/ar.alafasy/${ayah.number}.mp3`;
        if (audioRef.current) {
          audioRef.current.pause();
        }
        const audio = new Audio(audioUrl);
        audioRef.current = audio;
        setPlayingAyahNumber(ayah.number);

        audio.play().catch(e => {
          console.warn('Audio playback error:', e);
          setPlayingAyahNumber(null);
          showToast('تعذر تشغيل التلاوة الصوتية للآية.');
        });

        audio.onended = () => {
          setPlayingAyahNumber(null);
        };
      };

      // جلب التفسير الميسر
      const fetchTafseer = async (ayah) => {
        setLoadingTafseer(true);
        setTafseerText(null);
        try {
          const res = await fetch(`https://api.alquran.cloud/v1/ayah/${ayah.number}/ar.muyassar`);
          const data = await res.json();
          if (data && data.data && data.data.text) {
            setTafseerText(data.data.text);
          } else {
            setTafseerText('لم يتوفر تفسير لهذه الآية حالياً.');
          }
        } catch (e) {
          setTafseerText('تعذر تحميل التفسير، يرجى المحاولة لاحقاً.');
        } finally {
          setLoadingTafseer(false);
        }
      };

      const handleAyahClick = (ayah) => {
        setSelectedAyah(ayah);
        setTafseerText(null);
      };

      return (
        <div className={`flex flex-col select-text ${isModal ? 'max-w-4xl mx-auto w-full p-3 sm:p-6' : 'w-full'}`}>
          
          {/* TOAST MESSAGE */}
          {toastMsg && (
            <div className="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 bg-sage text-white text-xs font-bold px-4 py-2 rounded-2xl shadow-xl animate-gentle flex items-center gap-2">
              <span>✨</span>
              <span>{toastMsg}</span>
            </div>
          )}

          {/* TOP CONTROLS & NAVIGATION BAR */}
          <div className="bg-white dark:bg-gray-800 rounded-2xl p-3 sm:p-4 mb-4 border border-cream-dark dark:border-gray-700 shadow-sm flex flex-col md:flex-row md:items-center justify-between gap-3 select-none">
            
            {/* Right: Surah & Juz Selectors */}
            <div className="flex items-center gap-2 flex-wrap">
              {/* Surah Dropdown */}
              <select
                aria-label="اختر السورة للانتقال إليها"
                value={SURAHS_LIST.slice().reverse().find(s => s.page <= currentPage)?.id || 1}
                onChange={(e) => {
                  const s = SURAHS_LIST.find(item => item.id === Number(e.target.value));
                  if (s) onPageChange(s.page);
                }}
                className="bg-cream dark:bg-gray-900 border border-cream-dark dark:border-gray-700 text-xs font-bold text-slate dark:text-gray-200 px-3 py-2 rounded-xl focus:outline-none focus:ring-2 focus:ring-sage/40"
              >
                {SURAHS_LIST.map(s => (
                  <option key={s.id} value={s.id}>
                    {s.id}. سورة {s.name} (ص {s.page})
                  </option>
                ))}
              </select>

              {/* Juz Dropdown */}
              <select
                aria-label="اختر الجزء"
                value={JUZ_PAGES.filter(p => p <= currentPage).length || 1}
                onChange={(e) => {
                  const juzIdx = Number(e.target.value) - 1;
                  if (JUZ_PAGES[juzIdx]) onPageChange(JUZ_PAGES[juzIdx]);
                }}
                className="bg-cream dark:bg-gray-900 border border-cream-dark dark:border-gray-700 text-xs font-bold text-slate dark:text-gray-200 px-3 py-2 rounded-xl focus:outline-none"
              >
                {Array.from({ length: 30 }, (_, i) => (
                  <option key={i + 1} value={i + 1}>
                    الجزء {i + 1} (ص {JUZ_PAGES[i]})
                  </option>
                ))}
              </select>

              {/* Direct Page Input */}
              <div className="flex items-center gap-1.5 bg-cream dark:bg-gray-900 border border-cream-dark dark:border-gray-700 px-2 py-1 rounded-xl text-xs">
                <span className="text-slate-muted dark:text-gray-400">صفحة:</span>
                <input
                  type="number"
                  min="1"
                  max="604"
                  value={currentPage}
                  onChange={(e) => {
                    const val = Number(e.target.value);
                    if (val >= 1 && val <= 604) onPageChange(val);
                  }}
                  className="w-12 bg-white dark:bg-gray-800 text-center font-bold font-mono py-1 rounded-lg border border-gray-200 dark:border-gray-700 text-slate dark:text-white focus:outline-none"
                />
                <span className="text-slate-muted dark:text-gray-400">/ 604</span>
              </div>
            </div>

            {/* Left: Font Size, Bookmark, & Close Buttons */}
            <div className="flex items-center gap-2 flex-wrap">
              {/* Font Sizing */}
              <div className="flex items-center bg-cream dark:bg-gray-900 rounded-xl border border-cream-dark dark:border-gray-700 p-1">
                <button
                  onClick={() => setFontSize(Math.max(18, fontSize - 2))}
                  className="w-7 h-7 flex items-center justify-center font-bold text-xs rounded hover:bg-white dark:hover:bg-gray-800 text-slate dark:text-gray-300"
                  title="تصغير الخط"
                >
                  -A
                </button>
                <span className="text-[11px] px-1.5 font-mono text-slate-muted dark:text-gray-400">{fontSize}</span>
                <button
                  onClick={() => setFontSize(Math.min(36, fontSize + 2))}
                  className="w-7 h-7 flex items-center justify-center font-bold text-xs rounded hover:bg-white dark:hover:bg-gray-800 text-slate dark:text-gray-300"
                  title="تكبير الخط"
                >
                  +A
                </button>
              </div>

              {/* Save Bookmark */}
              <button
                onClick={() => {
                  onSaveBookmark(currentPage);
                  showToast(`تم حفظ الفاصل المرجعي عند صفحة ${currentPage} 🔖`);
                }}
                className={`px-3 py-1.5 rounded-xl text-xs font-bold transition flex items-center gap-1 border ${
                  quranBookmark === currentPage
                    ? 'bg-gold-light border-gold text-gold-accent dark:bg-yellow-950 dark:text-yellow-300'
                    : 'bg-white dark:bg-gray-800 border-cream-dark dark:border-gray-700 text-slate-muted dark:text-gray-300 hover:border-gold'
                }`}
                title="حفظ موضع توقفك الحالي"
              >
                <span>🔖</span>
                <span>{quranBookmark === currentPage ? 'الفاصل هنا' : 'حفظ الفاصل'}</span>
              </button>

              {/* Jump to Bookmark if different */}
              {quranBookmark && quranBookmark !== currentPage && (
                <button
                  onClick={() => onPageChange(quranBookmark)}
                  className="px-3 py-1.5 rounded-xl text-xs font-bold bg-cream dark:bg-gray-700 text-gold-accent dark:text-yellow-300 border border-gold/40 hover:bg-gold-light transition"
                  title="الانتقال إلى موضع الفاصل المحفوظ"
                >
                  <span>↩ الفاصل (ص {quranBookmark})</span>
                </button>
              )}

              {/* Close Button if in Modal */}
              {isModal && onClose && (
                <button
                  onClick={onClose}
                  className="w-8 h-8 rounded-xl bg-gray-100 dark:bg-gray-700 text-slate-muted dark:text-gray-300 hover:bg-red-50 hover:text-red-500 transition flex items-center justify-center font-bold text-sm"
                  title="إغلاق قارئ المصحف"
                >
                  ✕
                </button>
              )}
            </div>
          </div>

          {/* MAIN MUSHAF PAGE FRAME */}
          <div className="bg-[#FAF8F5] dark:bg-[#151B24] rounded-3xl p-5 sm:p-8 border-2 border-[#C5A880]/50 dark:border-gray-700 mushaf-page-border relative transition-all duration-200">
            
            {/* Traditional Top Page Header (Surah name, Juz & Page number) */}
            <div className="flex items-center justify-between pb-3 mb-5 border-b border-[#C5A880]/30 dark:border-gray-700 text-xs text-gold-accent dark:text-gold select-none font-bold">
              <div>
                <span>سورة </span>
                <span className="font-quran text-sm text-slate dark:text-gray-200">{currentMeta.surahName}</span>
              </div>
              <div className="text-center font-mono">
                <span>الجزء {toArabicDigits(currentMeta.juzNumber)}</span>
              </div>
              <div>
                <span>صفحة {toArabicDigits(currentPage)}</span>
              </div>
            </div>

            {/* LOADING STATE */}
            {loading && (
              <div className="py-24 text-center select-none animate-pulse">
                <div className="w-12 h-12 border-4 border-sage/20 border-t-sage rounded-full animate-spin mx-auto mb-4"></div>
                <p className="text-sm font-bold text-sage dark:text-emerald-400">جاري فتح صفحة المصحف الشريف بالرسم العثماني...</p>
                <p className="text-xs text-slate-muted dark:text-gray-400 mt-1">الصفحة {currentPage} من 604</p>
              </div>
            )}

            {/* ERROR STATE */}
            {error && !loading && (
              <div className="py-16 text-center select-none">
                <div className="text-3xl mb-3">⚠️</div>
                <p className="text-sm font-bold text-red-500 mb-2">{error}</p>
                <button
                  onClick={() => fetchPage(currentPage)}
                  className="px-4 py-2 rounded-xl bg-sage text-white text-xs font-bold hover:bg-sage-dark transition shadow-sm"
                >
                  إعادة المحاولة ⟲
                </button>
              </div>
            )}

            {/* PAGE CONTENT / AYAHS */}
            {!loading && !error && pageData && pageData.length > 0 && (
              <div className="min-h-[420px] flex flex-col justify-between">
                <div>
                  {pageData.map((ayah, index) => {
                    const isNewSurah = ayah.numberInSurah === 1;
                    const cleanSurahName = ayah.surah.name.replace('سُورَةُ ', '');

                    // إزالة البسملة من نص الآية الأولى إذا كانت موجودة مسبقاً لعرضها في ترويسة منفصلة
                    let displayText = ayah.text;
                    if (isNewSurah && ayah.surah.number !== 1 && ayah.surah.number !== 9) {
                      displayText = displayText.replace(/^بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ\s*/, '')
                                               .replace(/^﻿بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ\s*/, '');
                    }

                    const isAudioPlaying = playingAyahNumber === ayah.number;
                    const isAyahSelected = selectedAyah?.number === ayah.number;

                    return (
                      <React.Fragment key={ayah.number}>
                        {/* SURAH HEADER FRAME */}
                        {isNewSurah && (
                          <div className="my-6 border-2 border-[#C5A880]/70 bg-gold-light/60 dark:bg-yellow-950/30 rounded-2xl p-3 text-center shadow-xs select-none">
                            <div className="flex items-center justify-between text-xs text-gold-accent font-bold px-3">
                              <span>{ayah.surah.revelationType === 'Meccan' ? 'مكية' : 'مدنية'}</span>
                              <div className="flex items-center gap-1.5">
                                <span className="text-xs text-gold">۩</span>
                                <h3 className="text-lg md:text-xl font-bold font-quran text-slate dark:text-white">
                                  سُورَةُ {cleanSurahName}
                                </h3>
                                <span className="text-xs text-gold">۩</span>
                              </div>
                              <span>{ayah.surah.numberOfAyahs} آيات</span>
                            </div>
                          </div>
                        )}

                        {/* BASMALAH CALLIGRAPHY */}
                        {isNewSurah && ayah.surah.number !== 1 && ayah.surah.number !== 9 && (
                          <div className="text-center my-4 font-quran text-xl md:text-2xl text-slate-800 dark:text-gold tracking-wide select-none">
                            بِسْمِ ٱللَّهِ ٱلرَّحْمَٰنِ ٱلرَّحِيمِ
                          </div>
                        )}

                        {/* AYAH TEXT SPAN */}
                        <span
                          onClick={() => handleAyahClick(ayah)}
                          style={{ fontSize: `${fontSize}px` }}
                          className={`font-quran leading-[2.6] cursor-pointer rounded-lg px-1 transition-colors duration-150 inline ${
                            isAudioPlaying
                              ? 'bg-gold/40 dark:bg-yellow-900/60 text-sage-dark dark:text-yellow-200'
                              : isAyahSelected
                              ? 'bg-sage-light dark:bg-sage-dark/50'
                              : 'hover:bg-[#C5A880]/15 dark:hover:bg-gray-800 text-slate-800 dark:text-gray-100'
                          }`}
                          title="انقر لتدبر هذه الآية، الاستماع إليها، أو نسخها"
                        >
                          {displayText}
                          
                          {/* AYAH NUMBER BADGE */}
                          <span className="inline-flex items-center justify-center mx-1.5 text-gold-accent dark:text-gold font-sans font-bold text-xs select-none hover:scale-110 transition-transform">
                            <span className="text-gold opacity-75">﴿</span>
                            <span className="font-mono text-[11px] px-0.5">{toArabicDigits(ayah.numberInSurah)}</span>
                            <span className="text-gold opacity-75">﴾</span>
                          </span>
                        </span>
                      </React.Fragment>
                    );
                  })}
                </div>

                {/* BOTTOM OF MUSHAF PAGE NUMBER */}
                <div className="pt-6 mt-6 border-t border-[#C5A880]/30 dark:border-gray-700 flex items-center justify-between text-xs text-slate-muted dark:text-gray-400 select-none">
                  <div>
                    {currentPage > 1 && (
                      <span className="text-[11px]">الصفحة السابقة ‹</span>
                    )}
                  </div>
                  <div className="w-8 h-8 rounded-full border border-[#C5A880]/50 flex items-center justify-center font-bold text-gold-accent dark:text-gold">
                    {toArabicDigits(currentPage)}
                  </div>
                  <div>
                    {currentPage < 604 && (
                      <span className="text-[11px]">› الصفحة التالية</span>
                    )}
                  </div>
                </div>
              </div>
            )}
          </div>

          {/* AYAH QUICK ACTIONS DRAWER / MODAL */}
          {selectedAyah && (
            <div className="mt-4 p-4 rounded-2xl bg-white dark:bg-gray-800 border-2 border-sage/40 shadow-lg animate-gentle">
              <div className="flex items-start justify-between pb-3 mb-3 border-b border-cream-dark dark:border-gray-700">
                <div className="flex items-center gap-2">
                  <span className="text-lg">📖</span>
                  <div>
                    <h4 className="text-xs font-bold text-slate dark:text-white">
                      سورة {selectedAyah.surah.name.replace('سُورَةُ ', '')} — الآية {selectedAyah.numberInSurah}
                    </h4>
                    <p className="text-[11px] text-slate-muted dark:text-gray-400 font-quran line-clamp-1 mt-0.5">
                      "{selectedAyah.text}"
                    </p>
                  </div>
                </div>
                <button
                  onClick={() => { setSelectedAyah(null); setTafseerText(null); }}
                  className="text-xs font-bold text-slate-muted hover:text-red-500 px-2 py-1"
                >
                  ✕ إغلاق
                </button>
              </div>

              {/* Tafseer Text Preview if loaded */}
              {loadingTafseer && (
                <div className="p-3 bg-cream dark:bg-gray-900 rounded-xl text-xs text-sage animate-pulse mb-3">
                  جاري جلب التفسير الميسر للآية...
                </div>
              )}
              {tafseerText && !loadingTafseer && (
                <div className="p-3.5 bg-cream/80 dark:bg-gray-900/80 rounded-xl text-xs border border-cream-dark dark:border-gray-700 mb-3 leading-relaxed">
                  <div className="font-bold text-gold-accent mb-1 flex items-center gap-1">
                    <span>التفسير الميسر:</span>
                  </div>
                  <p className="text-slate-700 dark:text-gray-300">{tafseerText}</p>
                </div>
              )}

              {/* Action Buttons */}
              <div className="flex items-center gap-2 flex-wrap text-xs">
                {/* 1. Reflect Ayah in Daily Journal */}
                <button
                  onClick={() => {
                    onReflectAyah(selectedAyah);
                    showToast('تمت إضافة الآية بنجاح إلى حقل التدبر اليومي ✨');
                    if (isModal && onClose) onClose();
                  }}
                  className="px-3.5 py-2 rounded-xl font-bold bg-sage text-white hover:bg-sage-dark transition shadow-sm flex items-center gap-1.5"
                >
                  <span>✍️</span>
                  <span>تدبّر هذه الآية في يومك</span>
                </button>

                {/* 2. Listen to Ayah Audio */}
                <button
                  onClick={() => playAyahAudio(selectedAyah)}
                  className={`px-3 py-2 rounded-xl font-bold border transition flex items-center gap-1.5 ${
                    playingAyahNumber === selectedAyah.number
                      ? 'bg-red-50 text-red-600 border-red-200 dark:bg-red-950 dark:text-red-300'
                      : 'bg-white dark:bg-gray-700 border-gray-200 dark:border-gray-600 text-slate dark:text-white hover:border-sage'
                  }`}
                >
                  <span>{playingAyahNumber === selectedAyah.number ? '⏹ إيقاف التلاوة' : '🔊 استماع للآية'}</span>
                </button>

                {/* 3. Tafseer */}
                <button
                  onClick={() => fetchTafseer(selectedAyah)}
                  className="px-3 py-2 rounded-xl font-bold bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-slate dark:text-white hover:border-gold transition flex items-center gap-1.5"
                >
                  <span>💡</span>
                  <span>التفسير الميسر</span>
                </button>

                {/* 4. Copy Ayah */}
                <button
                  onClick={() => {
                    const textToCopy = `﴿${selectedAyah.text}﴾ [سورة ${selectedAyah.surah.name.replace('سُورَةُ ', '')}: ${selectedAyah.numberInSurah}]`;
                    navigator.clipboard?.writeText(textToCopy);
                    showToast('تم نسخ نص الآية إلى الحافظة 📋');
                  }}
                  className="px-3 py-2 rounded-xl font-bold bg-white dark:bg-gray-700 border border-gray-200 dark:border-gray-600 text-slate-muted dark:text-gray-300 hover:text-slate transition flex items-center gap-1.5"
                >
                  <span>📋</span>
                  <span>نسخ الآية</span>
                </button>
              </div>
            </div>
          )}

          {/* BOTTOM PAGE FLIPPING TOOLBAR */}
          <div className="mt-4 pt-3 flex flex-col sm:flex-row items-center justify-between gap-3 select-none">
            
            {/* Previous Page (RTL: turns to right) */}
            <button
              disabled={currentPage <= 1}
              onClick={() => onPageChange(currentPage - 1)}
              className={`w-full sm:w-auto px-4 py-2.5 rounded-xl text-xs font-bold border transition flex items-center justify-center gap-2 ${
                currentPage <= 1
                  ? 'opacity-40 cursor-not-allowed bg-gray-100 dark:bg-gray-800 text-gray-400'
                  : 'bg-white dark:bg-gray-800 border-cream-dark dark:border-gray-700 text-slate dark:text-white hover:border-sage'
              }`}
            >
              <span>‹ الصفحة السابقة (ص {currentPage - 1})</span>
            </button>

            {/* Quick Add Page to Daily Portion */}
            <button
              onClick={() => {
                onIncrementDailyPages();
                SoundEngine.playNotificationChime();
                if (typeof confetti === 'function') {
                  confetti({ particleCount: 35, spread: 60, origin: { y: 0.8 } });
                }
                showToast(`بارك الله فيك! تم احتساب صفحة في وردك اليومي (المجموع: ${dailyPagesCount + 1} ص) 🌱`);
              }}
              className="w-full sm:w-auto px-4 py-2.5 rounded-xl text-xs font-extrabold bg-gradient-to-r from-sage to-sage-dark text-white hover:opacity-95 transition shadow-sm flex items-center justify-center gap-2"
            >
              <span>✓ احتساب هذه الصفحة في ورد اليوم (+1 ص)</span>
            </button>

            {/* Next Page (RTL: turns to left) */}
            <button
              disabled={currentPage >= 604}
              onClick={() => onPageChange(currentPage + 1)}
              className={`w-full sm:w-auto px-4 py-2.5 rounded-xl text-xs font-bold border transition flex items-center justify-center gap-2 ${
                currentPage >= 604
                  ? 'opacity-40 cursor-not-allowed bg-gray-100 dark:bg-gray-800 text-gray-400'
                  : 'bg-white dark:bg-gray-800 border-cream-dark dark:border-gray-700 text-slate dark:text-white hover:border-sage'
              }`}
            >
              <span>الصفحة التالية (ص {currentPage + 1}) ›</span>
            </button>
          </div>

          <div className="mt-2 text-center text-[11px] text-slate-muted dark:text-gray-400 select-none">
            💡 نصيحة: يمكنك التنقل بين صفحات المصحف باستخدام أزرار الأسهم (→ و ←) في لوحة المفاتيح.
          </div>
        </div>
      );
    }

    // --- MAIN APP COMPONENT ---
    function App() {
      const [darkMode, setDarkMode] = useState(() => {
        return localStorage.getItem('muhasabah_theme') === 'dark';
      });

      const [activeTab, setActiveTab] = useState('dashboard');

      const [selectedCity, setSelectedCity] = useState(CITIES[0]);
      const [prayerTimes, setPrayerTimes] = useState({
        Fajr: '05:08',
        Sunrise: '06:32',
        Dhuhr: '12:47',
        Asr: '16:15',
        Maghrib: '18:59',
        Isha: '20:18'
      });
      const [isLoadingPrayers, setIsLoadingPrayers] = useState(false);

      const [intention, setIntention] = useState(() => {
        return localStorage.getItem('muhasabah_intention') || 'إخلاص العمل لله وبر الوالدين وحسن الخلق';
      });
      const [slipToAvoid, setSlipToAvoid] = useState(() => {
        return localStorage.getItem('muhasabah_slip') || 'فضول النظر والغيبة وضياع الوقت';
      });
      const [isMusharatahCommitted, setIsMusharatahCommitted] = useState(() => {
        return localStorage.getItem('muhasabah_musharatah_done') === 'true';
      });

      const [prayersState, setPrayersState] = useState(() => {
        const saved = localStorage.getItem('muhasabah_prayers');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return {
          fajr: { name: 'الفجر', prayed: true, onTime: true, congregation: true, rawatib: true, adhkar: true },
          dhuhr: { name: 'الظهر', prayed: true, onTime: true, congregation: false, rawatib: true, adhkar: true },
          asr: { name: 'العصر', prayed: false, onTime: false, congregation: false, rawatib: false, adhkar: false },
          maghrib: { name: 'المغرب', prayed: false, onTime: false, congregation: false, rawatib: false, adhkar: false },
          isha: { name: 'العشاء', prayed: false, onTime: false, congregation: false, rawatib: false, adhkar: false },
          duha: { name: 'صلاة الضحى', prayed: true },
          qiyam: { name: 'قيام الليل والوتر', prayed: false }
        };
      });

      // --- حالات ورد القرآن الكريم والقارئ التفاعلي ---
      const [quranPages, setQuranPages] = useState(() => Number(localStorage.getItem('muhasabah_quran_pages') || 10));
      const [currentQuranPage, setCurrentQuranPage] = useState(() => {
        return Number(localStorage.getItem('muhasabah_quran_current_page') || localStorage.getItem('muhasabah_quran_bookmark') || 1);
      });
      const [quranBookmark, setQuranBookmark] = useState(() => {
        return Number(localStorage.getItem('muhasabah_quran_bookmark') || 1);
      });
      const [isQuranReaderModalOpen, setIsQuranReaderModalOpen] = useState(false);
      const [isQuranEmbeddedOpen, setIsQuranEmbeddedOpen] = useState(false);

      const [juzNumber, setJuzNumber] = useState(() => Number(localStorage.getItem('muhasabah_juz') || 1));
      const [verseRef, setVerseRef] = useState(() => localStorage.getItem('muhasabah_verse_ref') || 'سورة الفرقان: 63');
      const [reflectionNote, setReflectionNote] = useState(() => localStorage.getItem('muhasabah_reflection') || 'وَعِبَادُ الرَّحْمَٰنِ الَّذِينَ يَمْشُونَ عَلَى الْأَرْضِ هَوْنًا.. أثر الآية: التحلي بالسكينة والتواضع في التعامل مع الناس عند الاختلاف.');
      const [savedReflections, setSavedReflections] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('muhasabah_saved_reflections') || '[]');
        } catch (e) { return []; }
      });

      const [completedAdhkar, setCompletedAdhkar] = useState(() => {
        try {
          return JSON.parse(localStorage.getItem('muhasabah_adhkar_checks') || '{"morning":["m1","m2"],"evening":[],"sleep":[]}');
        } catch (e) { return { morning: [], evening: [], sleep: [] }; }
      });

      const [currentDhikrIndex, setCurrentDhikrIndex] = useState(0);
      const [sebhaCount, setSebhaCount] = useState(() => Number(localStorage.getItem('muhasabah_sebha_count') || 0));
      const [totalDailyTasbeeh, setTotalDailyTasbeeh] = useState(() => Number(localStorage.getItem('muhasabah_total_tasbeeh') || 120));

      const [auditToggles, setAuditToggles] = useState(() => {
        const saved = localStorage.getItem('muhasabah_audit');
        if (saved) {
          try { return JSON.parse(saved); } catch (e) {}
        }
        return {
          tongue: true,
          gaze: true,
          duties: false,
          forgiveness: true
        };
      });
      const [istighfarCount, setIstighfarCount] = useState(() => Number(localStorage.getItem('muhasabah_istighfar') || 33));
      const [isAuditFinalized, setIsAuditFinalized] = useState(() => {
        return localStorage.getItem('muhasabah_audit_done') === 'true';
      });

      const [notifSettings, setNotifSettings] = useState(() => {
        return {
          fajrOffset: 15,
          duhaTime: '08:30',
          eveningOffset: 30,
          bedtime: '22:30',
          permissionGranted: (typeof Notification !== 'undefined' && Notification.permission === 'granted')
        };
      });
      const [notifBannerMsg, setNotifBannerMsg] = useState(null);

      const reflectionSectionRef = useRef(null);

      useEffect(() => {
        if (darkMode) {
          document.documentElement.classList.add('dark');
          localStorage.setItem('muhasabah_theme', 'dark');
        } else {
          document.documentElement.classList.remove('dark');
          localStorage.setItem('muhasabah_theme', 'light');
        }
      }, [darkMode]);

      useEffect(() => {
        localStorage.setItem('muhasabah_prayers', JSON.stringify(prayersState));
      }, [prayersState]);

      useEffect(() => {
        localStorage.setItem('muhasabah_audit', JSON.stringify(auditToggles));
      }, [auditToggles]);

      useEffect(() => {
        localStorage.setItem('muhasabah_adhkar_checks', JSON.stringify(completedAdhkar));
      }, [completedAdhkar]);

      useEffect(() => {
        localStorage.setItem('muhasabah_quran_pages', quranPages.toString());
      }, [quranPages]);

      const handlePageChange = (page) => {
        setCurrentQuranPage(page);
        localStorage.setItem('muhasabah_quran_current_page', page.toString());
        // تحديث الجزء المتوافق مع الصفحة تلقائياً
        const estimatedJuz = JUZ_PAGES.filter(p => p <= page).length || 1;
        setJuzNumber(estimatedJuz);
        localStorage.setItem('muhasabah_juz', estimatedJuz.toString());
      };

      const handleSaveBookmark = (page) => {
        setQuranBookmark(page);
        localStorage.setItem('muhasabah_quran_bookmark', page.toString());
      };

      const handleReflectAyahFromReader = (ayah) => {
        const surahName = ayah.surah.name.replace('سُورَةُ ', '');
        const refString = `سورة ${surahName}: ${ayah.numberInSurah}`;
        setVerseRef(refString);
        localStorage.setItem('muhasabah_verse_ref', refString);

        // صياغة مبدئية لتدبر الآية
        const template = `قال تعالى: "${ayah.text}"\nأثر الآية والعمل بها: `;
        setReflectionNote(template);
        localStorage.setItem('muhasabah_reflection', template);

        // التمرير إلى قسم التدبر
        setTimeout(() => {
          if (reflectionSectionRef.current) {
            reflectionSectionRef.current.scrollIntoView({ behavior: 'smooth' });
          }
        }, 150);
      };

      const fetchPrayerTimes = async (cityObj) => {
        setIsLoadingPrayers(true);
        try {
          const res = await fetch(`https://api.aladhan.com/v1/timingsByCity?city=${encodeURIComponent(cityObj.city)}&country=${encodeURIComponent(cityObj.country)}&method=4`);
          const data = await res.json();
          if (data && data.data && data.data.timings) {
            setPrayerTimes({
              Fajr: data.data.timings.Fajr,
              Sunrise: data.data.timings.Sunrise,
              Dhuhr: data.data.timings.Dhuhr,
              Asr: data.data.timings.Asr,
              Maghrib: data.data.timings.Maghrib,
              Isha: data.data.timings.Isha
            });
          }
        } catch (err) {
          console.warn('Falling back to default prayer calculation:', err);
        } finally {
          setIsLoadingPrayers(false);
        }
      };

      useEffect(() => {
        fetchPrayerTimes(selectedCity);
      }, [selectedCity]);

      const scoreMetrics = useMemo(() => {
        let score = 0;
        if (isMusharatahCommitted) score += 10;

        const mainPrayers = ['fajr', 'dhuhr', 'asr', 'maghrib', 'isha'];
        mainPrayers.forEach(key => {
          const p = prayersState[key];
          if (p.prayed) score += 4;
          if (p.onTime) score += 2;
          if (p.congregation) score += 1;
          if (p.adhkar) score += 1;
        });

        if (prayersState.duha.prayed) score += 5;
        if (prayersState.qiyam.prayed) score += 5;

        if (quranPages >= 1) score += 8;
        if (reflectionNote.trim().length > 10) score += 7;

        const adhkarCount = completedAdhkar.morning.length + completedAdhkar.evening.length + completedAdhkar.sleep.length;
        if (adhkarCount >= 3) score += 5;
        if (adhkarCount >= 8) score += 5;

        const auditCheckedCount = Object.values(auditToggles).filter(Boolean).length;
        score += Math.min(15, auditCheckedCount * 4);

        return Math.min(100, Math.round(score));
      }, [isMusharatahCommitted, prayersState, quranPages, reflectionNote, completedAdhkar, auditToggles]);

      const handleSebhaClick = () => {
        SoundEngine.playBeadClick();
        const curDhikr = DHIKR_PRESETS[currentDhikrIndex];
        const next = sebhaCount + 1;
        setSebhaCount(next);
        setTotalDailyTasbeeh(prev => prev + 1);
        localStorage.setItem('muhasabah_sebha_count', next.toString());
        localStorage.setItem('muhasabah_total_tasbeeh', (totalDailyTasbeeh + 1).toString());

        if (next === curDhikr.target) {
          if (typeof confetti === 'function') {
            confetti({
              particleCount: 50,
              spread: 60,
              origin: { y: 0.7 }
            });
          }
        }
      };

      const resetSebha = () => {
        setSebhaCount(0);
        localStorage.setItem('muhasabah_sebha_count', '0');
      };

      const togglePrayerSubProp = (prayerKey, propKey) => {
        setPrayersState(prev => ({
          ...prev,
          [prayerKey]: {
            ...prev[prayerKey],
            [propKey]: !prev[prayerKey][propKey]
          }
        }));
      };

      const toggleAdhkarItem = (category, id) => {
        setCompletedAdhkar(prev => {
          const list = prev[category] || [];
          const exists = list.includes(id);
          const next = exists ? list.filter(x => x !== id) : [...list, id];
          return { ...prev, [category]: next };
        });
      };

      const handleSaveReflection = () => {
        if (!verseRef.trim()) return;
        const newEntry = {
          id: Date.now(),
          date: new Date().toLocaleDateString('ar-EG', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' }),
          verse: verseRef,
          pages: quranPages,
          reflection: reflectionNote
        };
        const nextList = [newEntry, ...savedReflections.slice(0, 19)];
        setSavedReflections(nextList);
        localStorage.setItem('muhasabah_saved_reflections', JSON.stringify(nextList));
        localStorage.setItem('muhasabah_verse_ref', verseRef);
        localStorage.setItem('muhasabah_reflection', reflectionNote);
        localStorage.setItem('muhasabah_quran_pages', quranPages.toString());
        alert('تم حفظ تدبر اليوم في سجلك الإيماني بنجاح ✨');
      };

      const requestNotificationAccess = async () => {
        if (!('Notification' in window)) {
          alert('متصفحك لا يدعم الإشعارات المباشرة.');
          return;
        }
        const perm = await Notification.requestPermission();
        if (perm === 'granted') {
          setNotifSettings(prev => ({ ...prev, permissionGranted: true }));
          SoundEngine.playNotificationChime();
          new Notification('مُحاسبة — رفيقك الإيماني 🌙', {
            body: 'تم تفعيل التنبيهات المباركة بنجاح. سنذكرك بالمشارطة، الأوراد، والمحاسبة.',
            icon: 'https://cdn-icons-png.flaticon.com/512/3247/3247477.png'
          });
        }
      };

      const triggerTestNotification = () => {
        SoundEngine.playNotificationChime();
        if ('Notification' in window && Notification.permission === 'granted') {
          new Notification('تنبيه المحاسبة المسائية 🌙', {
            body: 'لحظة سكون.. حاسب نفسك قبل أن تُحاسب، اعفُ عمن أساء إليك ونَم بقلبٍ سليم.',
            icon: 'https://cdn-icons-png.flaticon.com/512/3247/3247477.png'
          });
        } else {
          setNotifBannerMsg('تم تشغيل نغمة التنبيه الهادئة! (قم بالسماح بالإشعارات في المتصفح لظهور الرسالة).');
          setTimeout(() => setNotifBannerMsg(null), 4500);
        }
      };

      return (
        <div className="max-w-4xl mx-auto px-4 py-6 md:py-10">
          
          {/* TOP BAR */}
          <header className="flex flex-col md:flex-row md:items-center justify-between pb-6 mb-6 border-b border-cream-dark dark:border-gray-800 gap-4">
            <div className="flex items-center space-x-3 space-x-reverse">
              <div className="w-12 h-12 rounded-2xl bg-sage text-white flex items-center justify-center shadow-md shadow-sage/20 text-2xl font-bold">
                مـ
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <h1 className="text-2xl font-extrabold tracking-tight text-slate dark:text-white">مُحاسَـبَة</h1>
                  <span className="text-[11px] bg-sage-light text-sage px-2.5 py-0.5 rounded-full font-bold border border-sage-border dark:bg-sage-dark dark:text-cream">
                    المشارطة والمراقبة والقرآن
                  </span>
                </div>
                <p className="text-xs text-slate-muted dark:text-gray-400 mt-0.5">
                  منهج السلف في محاسبة النفس، تجديد النية، تدبر كتاب الله، وسلامة الصدر قبل المنام
                </p>
              </div>
            </div>

            <div className="flex items-center gap-2.5 flex-wrap">
              <select
                aria-label="اختر مدينتك لمواقيت الصلاة"
                value={selectedCity.city}
                onChange={(e) => {
                  const c = CITIES.find(item => item.city === e.target.value);
                  if (c) setSelectedCity(c);
                }}
                className="bg-white dark:bg-gray-800 text-xs text-slate dark:text-gray-200 border border-cream-dark dark:border-gray-700 px-3 py-2 rounded-xl focus:outline-none focus:ring-2 focus:ring-sage/40"
              >
                {CITIES.map(c => (
                  <option key={c.city} value={c.city}>{c.name}</option>
                ))}
              </select>

              <button
                onClick={() => setDarkMode(!darkMode)}
                className="p-2 rounded-xl bg-white dark:bg-gray-800 border border-cream-dark dark:border-gray-700 text-slate dark:text-yellow-400 hover:bg-cream-dark transition"
                title="تبديل الوضع الليلي"
              >
                {darkMode ? '☀️' : '🌙'}
              </button>

              <button
                onClick={triggerTestNotification}
                className="flex items-center gap-1.5 px-3 py-2 text-xs font-semibold rounded-xl bg-sage text-white hover:bg-sage-dark transition shadow-sm"
              >
                <span>🔔</span>
                <span className="hidden sm:inline">تجربة نغمة التنبيه</span>
              </button>
            </div>
          </header>

          {notifBannerMsg && (
            <div className="mb-5 bg-gold-light border border-gold/40 text-gold-accent p-3 rounded-2xl text-xs flex items-center justify-between animate-gentle">
              <span>{notifBannerMsg}</span>
              <button onClick={() => setNotifBannerMsg(null)} className="font-bold text-sm mr-2">✕</button>
            </div>
          )}

          {/* HERO CARD */}
          <div className="bg-gradient-to-br from-sage to-sage-dark text-white rounded-3xl p-6 mb-8 shadow-lg shadow-sage/15 relative overflow-hidden">
            <div className="flex flex-col md:flex-row md:items-center justify-between gap-6 relative z-10">
              <div className="flex-1">
                <div className="flex items-center gap-2 mb-1.5">
                  <span className="text-xs bg-white/20 px-2.5 py-0.5 rounded-full font-bold">
                    اليوم {new Date().toLocaleDateString('ar-EG', { weekday: 'long', day: 'numeric', month: 'long' })}
                  </span>
                  <span className="text-xs text-cream/80">
                    {scoreMetrics >= 80 ? '🌱 يوم مبارك ومُثمر' : scoreMetrics >= 50 ? '🌾 في مسار الاستقامة' : '🌿 جدّد نيتك واستأنف'}
                  </span>
                </div>
                <h2 className="text-2xl font-bold font-quran leading-relaxed">
                  "حَاسِبُوا أَنْفُسَكُمْ قَبْلَ أَنْ تُحَاسَبُوا، وَزِنُوهَا قَبْلَ أَنْ تُوزَنُوا"
                </h2>
                <p className="text-xs text-cream/90 mt-1">
                  عمر بن الخطاب رضي الله عنه — اجعل لقلبك ميزاناً كل ليلة ونَم بسلامة صدر وتوبة صادقة.
                </p>
              </div>

              <div className="flex items-center gap-4 bg-white/10 backdrop-blur-md px-5 py-4 rounded-2xl border border-white/20 self-start md:self-auto">
                <div className="relative w-16 h-16 flex items-center justify-center">
                  <svg className="w-full h-full transform -rotate-90" viewBox="0 0 36 36">
                    <path
                      className="text-white/20"
                      strokeWidth="3.5"
                      stroke="currentColor"
                      fill="none"
                      d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                    />
                    <path
                      className="text-gold"
                      strokeDasharray={`${scoreMetrics}, 100`}
                      strokeWidth="3.5"
                      strokeLinecap="round"
                      stroke="currentColor"
                      fill="none"
                      d="M18 2.0845 a 15.9155 15.9155 0 0 1 0 31.831 a 15.9155 15.9155 0 0 1 0 -31.831"
                    />
                  </svg>
                  <span className="absolute text-sm font-extrabold text-white">{scoreMetrics}%</span>
                </div>
                <div>
                  <div className="text-xs text-cream/80">رصيد الاستقامة اليومي</div>
                  <div className="text-sm font-bold mt-0.5">
                    {scoreMetrics === 100 ? 'تمت المحاسبة بالكامل 👑' : `${scoreMetrics} من 100 نقطة`}
                  </div>
                </div>
              </div>
            </div>

            <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 mt-6 pt-5 border-t border-white/15">
              <div className="bg-white/10 rounded-xl p-2.5 text-center">
                <div className="text-[11px] text-cream/80">الصلوات المكتوبة</div>
                <div className="text-base font-bold mt-0.5">
                  {Object.values(prayersState).slice(0, 5).filter(p => p.prayed).length} / 5
                </div>
              </div>

              {/* CARD: QURAN WITH DIRECT CLICK-TO-OPEN */}
              <div

                    currentPage={currentQuranPage}
                    onPageChange={handlePageChange}
                    isModal={true}
                    onClose={() => setIsQuranReaderModalOpen(false)}
                    onReflectAyah={handleReflectAyahFromReader}
                    quranBookmark={quranBookmark}
                    onSaveBookmark={handleSaveBookmark}
                    onIncrementDailyPages={() => setQuranPages(prev => prev + 1)}
                    dailyPagesCount={quranPages}
                  />
                </div>
              </div>
            </div>
          )}

          {/* TAB 4: TASBEEH */}
          {(activeTab === 'tasbeeh' || activeTab === 'dashboard') && (
            <div className="bg-white dark:bg-gray-800 rounded-3xl p-6 mb-6 shadow-sm border border-cream-dark dark:border-gray-700">
              <div className="flex items-center justify-between pb-4 mb-4 border-b border-cream-dark dark:border-gray-700">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-2xl bg-sage-light text-sage flex items-center justify-center text-lg dark:bg-sage-dark dark:text-cream">
                    📿
                  </div>
                  <div>
                    <h3 className="text-lg font-bold text-slate dark:text-white">السبحة الرقمية وحصن الأذكار</h3>
                    <p className="text-xs text-slate-muted dark:text-gray-400">
                      ذكرٌ لا ينقطع بصوت هادئ ومظهر مريح للنفس
                    </p>
                  </div>
                </div>

                <div className="text-xs font-bold text-slate dark:text-gray-300 bg-cream dark:bg-gray-900 px-3 py-1.5 rounded-xl">
                  مجموع التسبيح اليوم: <span className="text-sage font-extrabold">{totalDailyTasbeeh}</span>
                </div>
              </div>

              <div className="bg-gradient-to-b from-cream to-[#F4EFEA] dark:from-gray-900 dark:to-gray-900/80 p-6 rounded-3xl border border-cream-dark dark:border-gray-700 text-center mb-6">
                <div className="mb-4">
                  <div className="flex items-center justify-center gap-2 mb-2">
                    <button
                      onClick={() => {
                        const idx = (currentDhikrIndex - 1 + DHIKR_PRESETS.length) % DHIKR_PRESETS.length;
                        setCurrentDhikrIndex(idx);
                        resetSebha();
                      }}
                      className="p-1.5 rounded-full hover:bg-white dark:hover:bg-gray-800 text-slate-muted"
                    >
                      ‹
                    </button>
                    <span className="text-lg font-bold font-quran text-slate dark:text-white px-3 py-1 bg-white dark:bg-gray-800 rounded-xl shadow-xs border border-cream-dark dark:border-gray-700">
                      {DHIKR_PRESETS[currentDhikrIndex].text}
                    </span>
                    <button
                      onClick={() => {
                        const idx = (currentDhikrIndex + 1) % DHIKR_PRESETS.length;
                        setCurrentDhikrIndex(idx);
                        resetSebha();
                      }}
                      className="p-1.5 rounded-full hover:bg-white dark:hover:bg-gray-800 text-slate-muted"
                    >
                      ›
                    </button>
                  </div>
                  <div className="text-[11px] text-slate-muted dark:text-gray-400">
                    فضل الذكر: {DHIKR_PRESETS[currentDhikrIndex].virtue}
                  </div>
                </div>

                <div className="my-6 flex justify-center">
                  <button
                    onClick={handleSebhaClick}
                    className="w-44 h-44 rounded-full bg-sage hover:bg-sage-dark active:scale-95 text-white shadow-xl shadow-sage/30 flex flex-col items-center justify-center transition-transform duration-100 border-4 border-white dark:border-gray-800 relative select-none"
                  >
                    <span className="text-4xl font-extrabold font-mono tracking-wider">{sebhaCount}</span>
                    <span className="text-xs text-cream/80 mt-1">
                      الهدف: {DHIKR_PRESETS[currentDhikrIndex].target}
                    </span>
                    <div className="absolute bottom-4 text-[10px] text-cream/70">انقر للعد</div>
                  </button>
                </div>

                <div className="flex items-center justify-center gap-3">
                  <button
                    onClick={resetSebha}
                    className="px-3.5 py-1.5 text-xs text-slate-muted dark:text-gray-400 bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700 hover:text-red-500 transition"
                  >
                    تصفير العداد ⟲
                  </button>
                  <button
                    onClick={() => SoundEngine.playBeadClick()}
                    className="px-3.5 py-1.5 text-xs text-slate-muted dark:text-gray-400 bg-white dark:bg-gray-800 rounded-xl border border-gray-200 dark:border-gray-700"
                  >
                    صوت الخرز 🔊
                  </button>
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                {[
                  { key: 'morning', title: 'أذكار الصباح', icon: '🌅', color: 'border-yellow-200 dark:border-yellow-900/40' },
                  { key: 'evening', title: 'أذكار المساء', icon: '🌇', color: 'border-orange-200 dark:border-orange-900/40' },
                  { key: 'sleep', title: 'أذكار النوم والعفو', icon: '🌙', color: 'border-indigo-200 dark:border-indigo-900/40' }
                ].map(cat => (
                  <div key={cat.key} className={`bg-cream/70 dark:bg-gray-900/50 p-4 rounded-2xl border ${cat.color}`}>
                    <div className="flex items-center justify-between mb-3">
                      <div className="flex items-center gap-1.5">
                        <span>{cat.icon}</span>
                        <span className="text-xs font-bold text-slate dark:text-white">{cat.title}</span>
                      </div>
                      <span className="text-[10px] text-slate-muted">
                        {completedAdhkar[cat.key].length} / {ADHKAR_CHECKLIST[cat.key].length}
                      </span>
                    </div>
                    <div className="space-y-2">
                      {ADHKAR_CHECKLIST[cat.key].map(item => {
                        const checked = completedAdhkar[cat.key].includes(item.id);
                        return (
                          <div
                            key={item.id}
                            onClick={() => toggleAdhkarItem(cat.key, item.id)}
                            className="flex items-start gap-2 cursor-pointer p-1.5 rounded-lg hover:bg-white/70 dark:hover:bg-gray-800/70 transition text-right"
                          >
                            <div className={`w-4 h-4 mt-0.5 rounded flex items-center justify-center text-[10px] border shrink-0 ${
                              checked ? 'bg-sage border-sage text-white' : 'border-gray-300 dark:border-gray-600 bg-white dark:bg-gray-700'
                            }`}>
                              {checked && '✓'}
                            </div>
                            <span className={`text-[11px] leading-4 select-none ${
                              checked ? 'text-gray-400 line-through' : 'text-slate dark:text-gray-200'
                            }`}>
                              {item.text}
                            </span>
                          </div>
                        );
                      })}
                    </div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* TAB 5: MUHASABAH */}
          {(activeTab === 'muhasabah' || activeTab === 'dashboard') && (
            <div className="bg-[#1E2633] text-white rounded-3xl p-6 mb-6 shadow-xl border border-gray-700">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between pb-4 mb-4 border-b border-gray-700 gap-2">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-2xl bg-indigo-900/60 text-yellow-300 flex items-center justify-center text-lg border border-indigo-700">
                    🌙
                  </div>
                  <div>
                    <h3 className="text-lg font-bold text-white">المحاسبة المسائية وتخلية القلب</h3>
                    <p className="text-xs text-gray-400">
                      قف مع نفسك 3 دقائق قبل النوم لتنام بقلبٍ سليم موصول بالله
                    </p>
                  </div>
                </div>

                <div className="text-xs bg-gray-800 px-3 py-1.5 rounded-xl border border-gray-700 text-gold">
                  خلوة ما قبل النوم
                </div>
              </div>

              <div className="grid grid-cols-1 md:grid-cols-2 gap-4 my-5">
                {[
                  {
                    key: 'tongue',
                    title: 'حفظ اللسان من اللغو والغيبة',
                    sub: 'هل عصمت لسانك اليوم من الغيبة، النميمة، وفضول الكلام الذي لا فائدة منه؟',
                    icon: '🗣️'
                  },
                  {
                    key: 'gaze',
                    title: 'غض البصر وحفظ الجوارح',
                    sub: 'هل حفظت بصرك وسمعك عن المشاهد الحرام وما لا يحل لك في الواقع والشاشات؟',
                    icon: '👁️'
                  },
                  {
                    key: 'duties',
                    title: 'أداء الأمانة وإتقان العمل',
                    sub: 'هل أديت عملك وواجباتك بصدق ونزاهة وإتقان دون تهاون أو تفريط؟',
                    icon: '⚖️'
                  },
                  {
                    key: 'forgiveness',
                    title: 'سلامة الصدر والعفو عن الناس',
                    sub: 'هل عفوت عمن ظلمك أو أساء إليك لتبيت الليلة بقلب نقي لا غل فيه لأحد؟',
                    icon: '🤍'
                  }
                ].map(item => {
                  const active = auditToggles[item.key];
                  return (
                    <div
                      key={item.key}
                      onClick={() => setAuditToggles(prev => ({ ...prev, [item.key]: !prev[item.key] }))}
                      className={`cursor-pointer p-4 rounded-2xl border transition-all duration-200 flex items-start justify-between gap-3 ${
                        active
                          ? 'bg-sage/20 border-sage text-white'
                          : 'bg-gray-800/60 border-gray-700 hover:border-gray-600 text-gray-300'
                      }`}
                    >
                      <div className="flex-1">
                        <div className="flex items-center gap-2 mb-1">
                          <span>{item.icon}</span>
                          <h4 className="text-xs font-bold text-white">{item.title}</h4>
                        </div>
                        <p className="text-[11px] text-gray-400 leading-relaxed">{item.sub}</p>
                      </div>

                      <div className={`w-10 h-6 rounded-full p-1 transition-colors duration-200 flex items-center shrink-0 ${
                        active ? 'bg-sage justify-end' : 'bg-gray-700 justify-start'
                      }`}>
                        <div className="w-4 h-4 rounded-full bg-white shadow-md"></div>
                      </div>
                    </div>
                  );
                })}
              </div>

              <div className="bg-gray-900/80 p-4 rounded-2xl border border-gray-800 flex flex-col sm:flex-row items-center justify-between gap-4 mt-4">
                <div className="text-center sm:text-right">
                  <div className="text-xs font-bold text-white mb-0.5">استغفار الختام وتجديد التوبة:</div>
                  <div className="text-sm font-quran text-gold">"أَسْتَغْفِرُ اللَّهَ الْعَظِيمَ الَّذِي لَا إِلَهَ إِلَّا هُوَ الْحَيَّ الْقَيُّومَ وَأَتُوبُ إِلَيْهِ"</div>
                </div>

                <div className="flex items-center gap-3">
                  <button
                    onClick={() => {
                      SoundEngine.playBeadClick();
                      const n = istighfarCount + 1;
                      setIstighfarCount(n);
                      localStorage.setItem('muhasabah_istighfar', n.toString());
                    }}
                    className="px-4 py-2 bg-sage hover:bg-sage-dark text-white rounded-xl text-xs font-bold transition flex items-center gap-2 shadow-sm"
                  >
                    <span>استغفار</span>
                    <span className="bg-white/20 px-2 py-0.5 rounded-md font-mono">{istighfarCount}</span>
                  </button>

                  <button
                    onClick={() => {
                      setIsAuditFinalized(true);
                      localStorage.setItem('muhasabah_audit_done', 'true');
                      if (typeof confetti === 'function') {
                        confetti({
                          particleCount: 70,
                          spread: 80,
                          origin: { y: 0.6 }
                        });
                      }
                      alert('تقبل الله منك.. نم بقلب سليم، غفر الله لك ما تقدم من ذنبك 🌙');
                    }}
                    className="px-4 py-2 bg-white/10 hover:bg-white/20 text-white rounded-xl text-xs font-bold transition border border-white/10"
                  >
                    ختم المحاسبة المسائية ✓
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* TAB 6: NOTIFICATIONS */}
          {(activeTab === 'notifications') && (
            <div className="bg-white dark:bg-gray-800 rounded-3xl p-6 mb-6 shadow-sm border border-cream-dark dark:border-gray-700">
              <div className="flex items-center justify-between pb-4 mb-4 border-b border-cream-dark dark:border-gray-700">
                <div className="flex items-center gap-3">
                  <div className="w-10 h-10 rounded-2xl bg-sage-light text-sage flex items-center justify-center text-lg dark:bg-sage-dark dark:text-cream">
                    ⏰
                  </div>
                  <div>
                    <h3 className="text-lg font-bold text-slate dark:text-white">نظام التنبيهات الإيمانية الذكي</h3>
                    <p className="text-xs text-slate-muted dark:text-gray-400">
                      مواقيت دقيقة مرتبطة بمواعيد الصلاة وشروق الشمس والنوم
                    </p>
                  </div>
                </div>

                {!notifSettings.permissionGranted && (
                  <button
                    onClick={requestNotificationAccess}
                    className="px-4 py-2 rounded-xl text-xs font-bold bg-sage text-white hover:bg-sage-dark transition shadow-sm"
                  >
                    تفعيل إشعارات المتصفح 🔔
                  </button>
                )}
              </div>

              <div className="space-y-3">
                {[
                  {
                    title: 'المشارطة الصباحية (بعد الفجر بـ 15 دقيقة)',
                    text: 'ابدأ يومك بالمشارطة وتحديد نية اليوم وما تعزم على تجنبه.',
                    time: `تقريباً ${prayerTimes.Fajr} + 15د`,
                    icon: '🌅'
                  },
                  {
                    title: 'زاد الضحى وأذكار الصباح',
                    text: 'ركعتا الضحى وأذكار الصباح حصنك الحصين.',
                    time: '08:30 صباحاً',
                    icon: '☀️'
                  },
                  {
                    title: 'أذكار المساء وورد القرآن وتدبر آية',
                    text: 'أقبل المساء.. رطب لسانك بالذكر واستفتح مصحفك بتدبر آية.',
                    time: `عند وقت العصر (${prayerTimes.Asr})`,
                    icon: '📖'
                  },
                  {
                    title: 'المحاسبة المسائية وتخلية القلب (قبل النوم)',
                    text: 'لحظة سكون.. حاسب نفسك قبل أن تُحاسب، اعفُ عمن ظلمك ونم بقلب سليم.',
                    time: '10:30 مساءً',
                    icon: '🌙'
                  }
                ].map((slot, i) => (
                  <div key={i} className="flex items-center justify-between p-4 rounded-2xl bg-cream dark:bg-gray-900/60 border border-cream-dark dark:border-gray-700">
                    <div className="flex items-center gap-3">
                      <span className="text-xl">{slot.icon}</span>
                      <div>
                        <h4 className="text-xs font-bold text-slate dark:text-white">{slot.title}</h4>
                        <p className="text-[11px] text-slate-muted dark:text-gray-400 mt-0.5">"{slot.text}"</p>
                      </div>
                    </div>
                    <span className="text-xs font-mono font-bold text-sage bg-white dark:bg-gray-800 px-2.5 py-1 rounded-lg border border-cream-dark dark:border-gray-700">
                      {slot.time}
                    </span>
                  </div>
                ))}
              </div>

              <div className="mt-6 flex justify-end">
                <button
                  onClick={triggerTestNotification}
                  className="px-5 py-2.5 rounded-xl text-xs font-bold bg-slate dark:bg-gray-700 text-white hover:bg-slate-darker transition flex items-center gap-2"
                >
                  <span>🔊 تجربة إشعار فوري بصوت هادئ</span>
                </button>
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="pt-8 pb-12 text-center border-t border-cream-dark dark:border-gray-800 text-xs text-slate-muted dark:text-gray-500">
            <div className="flex justify-center items-center gap-2 mb-2 font-quran text-sm text-slate dark:text-gray-300">
              <span>"وَنَفْسٍ وَمَا سَوَّاهَا • فَأَلْهَمَهَا فُجُورَهَا وَتَقْوَاهَا • قَدْ أَفْلَحَ مَن زَكَّاهَا"</span>
            </div>
            <p>مُحاسبة — صُمم ليكون رفيقاً لقلبك على طريق الاستقامة وحسن الخاتمة</p>
            <div className="flex justify-center gap-4 mt-3 text-[11px]">
              <button
                onClick={() => {
                  if (confirm('هل تريد تصفير مدخلات اليوم للبدء من جديد؟')) {
                    localStorage.clear();
                    window.location.reload();
                  }
                }}
                className="text-red-500 hover:underline"
              >
                تصفير بيانات اليوم ⟲
              </button>
              <span>•</span>
              <a href="https://github.com/mohamedjs/muhasabah" target="_blank" className="text-sage hover:underline">
                مستودع المشروع على GitHub
              </a>
            </div>
          </footer>

        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
